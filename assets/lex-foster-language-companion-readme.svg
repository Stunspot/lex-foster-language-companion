      <g transform="translate(119 112)"><text fill="#f3f8fb" font-size="19" font-weight="700">CONVERSATIONAL</text><text fill="#b8cedb" font-size="16"><tspan x="0" dy="31">Natural dialogue</tspan><tspan x="0" dy="24">that teaches</tspan><tspan x="0" dy="24">as you talk.</tspan></text></g>
      <g transform="translate(358 112)"><text fill="#f3f8fb" font-size="19" font-weight="700">STRUCTURED LEARNING</text><text fill="#b8cedb" font-size="16"><tspan x="0" dy="31">Lessons, grammar,</tspan><tspan x="0" dy="24">vocabulary, and</tspan><tspan x="0" dy="24">progress tracking.</tspan></text></g>
      <g transform="translate(597 112)"><text fill="#f3f8fb" font-size="19" font-weight="700">PRONUNCIATION</text><text fill="#b8cedb" font-size="16"><tspan x="0" dy="31">Phonetics, listening</tspan><tspan x="0" dy="24">practice, and</tspan><tspan x="0" dy="24">accent support.</tspan></text></g>
