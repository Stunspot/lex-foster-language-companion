      <g transform="translate(1314 112)"><text fill="#f3f8fb" font-size="19" font-weight="700">ADAPTIVE &amp; PERSONAL</text><text fill="#b8cedb" font-size="16"><tspan x="0" dy="31">Tailored to your level,</tspan><tspan x="0" dy="24">goals, and learning</tspan><tspan x="0" dy="24">style.</tspan></text></g>
