<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
  <title id="title">Lex Foster Language Companion</title>
  <desc id="desc">A blue technical interface banner for an AI language tutoring skill for agents, with multilingual speech bubbles and tutoring, pronunciation, translation, culture, and adaptive learning features.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset="0.55" stop-color="#06142a"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21a9ff"/>
      <stop offset="1" stop-color="#48cbe8"/>
    </linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbe8ef"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#163451" stroke-width="1" opacity="0.35"/>
    </pattern>
    <pattern id="dots" width="13" height="13" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.7" fill="#1b78d0" opacity="0.55"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frameClip"><rect x="14" y="14" width="1508" height="996" rx="36"/></clipPath>
  </defs>
